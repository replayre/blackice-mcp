[project]
name = "blackice-mcp"
version = "0.1.0"
description = "MCP hub for BlackICE / REServer development"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2",
    "platformdirs>=4.12.4",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
blackice-mcp = "blackice_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blackice_mcp"]

[tool.hatch.build.hooks.custom]
